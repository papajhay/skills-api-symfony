
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skills_api_php
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-change-me-in-docker}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
    volumes:
      - ./:/app
      - php_vendor:/app/vendor
      - php_var:/app/var
      - caddy_data:/data
      - caddy_config:/config
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: skills_api_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  database_data:
  php_vendor:
  php_var:
  caddy_data:
  caddy_config:
